const nodeEls=new Map([...svg.querySelectorAll('[data-node]')].map(el=>[el.dataset.node,el]));
function write(info,title,path){$('detail-title').textContent=title;$('path').textContent=path||'';for(const key of ['why','transfer','returns','condition'])$(key).textContent=info[key]||'';}
function apply(ids,overview=false){selected=ids;picked=null;const set=new Set(ids),nodes=new Set();ids.forEach(id=>{const e=data.edges[id];nodes.add(e.source);nodes.add(e.target)});edgeEls.forEach((el,id)=>{el.classList.toggle('dim',!overview&&!set.has(id));el.classList.toggle('active',!overview&&set.has(id));el.classList.remove('picked')});nodeEls.forEach((el,id)=>{el.classList.toggle('dim',!overview&&!nodes.has(id));el.classList.toggle('related',!overview&&nodes.has(id))});$('edges').replaceChildren(new Option('选择一条线查看',''));ids.forEach(id=>{const e=data.edges[id];$('edges').add(new Option(data.nodes[e.source].title+' → '+data.nodes[e.target].title,id))});}
function pressed(group,id){$(group).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===String(id))))}
function mode(id){current=id;const m=data.modes.find(m=>m.id===id);apply(m.edges,id==='overview');write(m,m.name,m.path);pressed('modes',id);pressed('steps','');$('phases').hidden=id!=='mcp';if(id==='mcp')pressed('phases','all')}
function step(n){current='main';apply(data.steps[String(n)]);pressed('modes','main');pressed('steps',n);$('phases').hidden=true;const m=data.modes.find(m=>m.id==='main');write(m,'第 '+n+' 步 · '+data.stepTitles[n-1],n===8?'日志 → 事件总线 → 推送 → 用户':n===6?'验参 → 规则与决策 →〔需要时确认并重新授权〕':m.path);focusSelection()}
function edge(id){const e=data.edges[id];picked=id;edgeEls.forEach((el,key)=>el.classList.toggle('picked',key===id));$('edges').value=id;write(e,e.label||e.why,data.nodes[e.source].title+' → '+data.nodes[e.target].title)}
function viewSet(v){fitMode=null;view=v;svg.setAttribute('viewBox',v.join(' '))}
function bounds(ids){const pts=ids.flatMap(id=>{const e=data.edges[id];return [...e.points,...[e.source,e.target].flatMap(key=>{const [x,y,w,h]=data.nodes[key].box;return [[x,y],[x+w,y+h]]})]});if(!pts.length)return [0,0,6000,7520];const xs=pts.map(p=>p[0]),ys=pts.map(p=>p[1]);return [Math.min(...xs)-120,Math.min(...ys)-120,Math.max(...xs)-Math.min(...xs)+240,Math.max(...ys)-Math.min(...ys)+240]}
function fitBox(box){const r=viewport.getBoundingClientRect();if(r.width<=0||r.height<=0)return;const left=16,right=16,top=Math.min(64,r.height*.15),bottom=Math.min(36,r.height*.10),iw=Math.max(1,r.width-left-right),ih=Math.max(1,r.height-top-bottom);const [x,y,w,h]=box,scale=Math.min(iw/w,ih/h);viewSet([x-(iw/scale-w)/2-left/scale,y-(ih/scale-h)/2-top/scale,r.width/scale,r.height/scale])}
function fitAll(){fitBox([0,0,6000,7520]);fitMode='all'}
function fitWidth(){const r=viewport.getBoundingClientRect();if(r.width<=0||r.height<=0)return;viewSet([0,0,6000,6000*r.height/r.width]);fitMode='width'}
function focusSelection(){fitBox(bounds(picked===null?selected:[picked]))}
function zoom(factor,cx=.5,cy=.5){const nw=Math.max(700,Math.min(20000,view[2]*factor)),nh=nw*view[3]/view[2];viewSet([view[0]+(view[2]-nw)*cx,view[1]+(view[3]-nh)*cy,nw,nh])}
function button(parent,value,label,fn){const b=document.createElement('button');b.textContent=label;b.dataset.value=value;b.setAttribute('aria-pressed','false');b.onclick=fn;$(parent).append(b)}
data.modes.forEach(m=>button('modes',m.id,m.name,()=>mode(m.id)));data.stepTitles.forEach((t,i)=>button('steps',i+1,(i+1)+' '+t,()=>step(i+1)));
for(const [id,title] of [['all','MCP 全路径'],['startup','启动：发现与注册'],['execution','执行：治理与调用']])button('phases',id,title,()=>{apply(data.mcpPhases[id]);pressed('phases',id);const m=data.modes.find(m=>m.id==='mcp');write(m,title,m.path);focusSelection()});
$('edges').onchange=e=>{if(e.target.value!=='')edge(Number(e.target.value))};$('plus').onclick=()=>zoom(.75);$('minus').onclick=()=>zoom(1.33);$('fit').onclick=fitAll;$('width').onclick=fitWidth;$('focus').onclick=focusSelection;
viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect();zoom(e.deltaY>0?1.15:.87,(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height)},{passive:false});
viewport.addEventListener('pointerdown',e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,v:[...view]};moved=false;viewport.setPointerCapture(e.pointerId);viewport.classList.add('dragging')});
viewport.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;const r=viewport.getBoundingClientRect();viewSet([drag.v[0]-dx*r.width**-1*drag.v[2],drag.v[1]-dy/r.height*drag.v[3],drag.v[2],drag.v[3]])});
function pointerEnd(e){if(!drag)return;drag=null;viewport.classList.remove('dragging');if(moved)return;const hit=document.elementFromPoint(e.clientX,e.clientY),eg=hit&&hit.closest('[data-edge]'),ng=hit&&hit.closest('[data-node]');if(eg)edge(Number(eg.dataset.edge));else if(ng){const n=data.nodes[ng.dataset.node];fitBox([n.box[0]-120,n.box[1]-160,n.box[2]+240,n.box[3]+320]);write({why:n.body.join(' '),transfer:n.ref,returns:'点击相关连线可查看结果返回位置。',condition:'组件是否启用取决于具体入口、任务或配置。'},n.title,'组件职责')}}
viewport.addEventListener('pointerup',pointerEnd);viewport.addEventListener('pointercancel',()=>{drag=null;viewport.classList.remove('dragging')});
svg.addEventListener('keydown',e=>{const g=e.target.closest('[data-edge]');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();edge(Number(g.dataset.edge))}});
mode('overview');fitAll();
new ResizeObserver(()=>{if(fitMode==='all')fitAll();else if(fitMode==='width')fitWidth();else{const r=viewport.getBoundingClientRect();if(r.width>0&&r.height>0){const h=view[2]*r.height/r.width;viewSet([view[0],view[1]+(view[3]-h)/2,view[2],h])}}}).observe(viewport);
</script></body></html>
